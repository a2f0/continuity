name: Freshness

# Canon dates are fixed, but tearleads judges expiration against the real
# clock. This fails ahead of time so documents are renewed in canon before
# screenshots start showing expired IDs.

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: Document freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
          install_args: bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check document expirations
        run: bun run canon:freshness
