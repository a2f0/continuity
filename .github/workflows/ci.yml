name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun and ShellCheck
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pre-push lints a pushed branch only where hooks are installed, so a
      # pull request opened from any other clone is checked here. The name is
      # untrusted input: it reaches the shell only through the environment.
      - name: Check branch name
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: bun run lint:branch-name "$BRANCH_NAME"

      - name: Run static checks
        run: bun run check:fast

  # Rendering runs on Linux and macOS: genesis/ is checked byte for byte, so
  # this proves the renderer is deterministic across platforms, not just on
  # the machine that generated the committed files.
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install gallery test browser
        run: bun x --no-install playwright install --with-deps chromium

      - name: Run tests
        run: bun run test

      # Report every signal: a failing test must not hide a rendering
      # difference between platforms.
      - name: Check canon
        if: ${{ !cancelled() }}
        run: bun run canon:check

      - name: Check genesis output
        if: ${{ !cancelled() }}
        run: bun run genesis:check

      - name: Build asset gallery
        if: ${{ !cancelled() }}
        run: bun run site:build

  gate:
    name: CI gate
    if: always()
    needs: [lint, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Require every check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$CI_NEEDS" | bun run agent-tool ci gate - --policy scripts/checks/ci-gate.json
